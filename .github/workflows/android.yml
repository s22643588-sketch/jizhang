name: 打包 Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 放入網頁畫面
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest sw.js android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/

      - name: 還原簽章金鑰
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::請到 Settings → Secrets and variables → Actions 新增 KEYSTORE_B64 和 KEYSTORE_PASS"; exit 1; fi
          echo "$KS" | base64 -d > android/app/release.jks

      - name: 打包 APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PATH: release.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理檔案
        run: cp android/app/build/outputs/apk/release/app-release.apk jizhang.apk

      - name: 發佈到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 記帳小夥伴 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: jizhang.apk
          make_latest: true
