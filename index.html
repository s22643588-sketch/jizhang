<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f2f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳小夥伴">
<title>記帳小夥伴</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{
--color-bg:#f3f2f2;--color-surface:#eae9e9;--color-text:#201e1d;--color-accent:#0088b0;
--color-divider:color-mix(in srgb,#201e1d 16%,transparent);
--color-neutral-100:#f8f4f4;--color-neutral-200:#eae7e7;--color-neutral-300:#d7d3d3;--color-neutral-400:#bab6b6;--color-neutral-500:#9b9797;--color-neutral-600:#7d7979;--color-neutral-700:#605d5d;--color-neutral-800:#444141;--color-neutral-900:#2d2b2b;
--color-accent-100:#e9f8ff;--color-accent-200:#cbeeff;--color-accent-300:#99e0ff;--color-accent-400:#62c5ee;--color-accent-500:#38a6cf;--color-accent-600:#1186ac;--color-accent-700:#006786;--color-accent-800:#004961;--color-accent-900:#0a303e;
--color-accent-2-100:#fff1f4;--color-accent-2-200:#ffdee6;--color-accent-2-300:#ffc0d0;--color-accent-2-400:#ff90b1;--color-accent-2-500:#ff458e;--color-accent-2-600:#d82071;--color-accent-2-700:#aa0b56;--color-accent-2-800:#790e3d;--color-accent-2-900:#4b1528;
--color-process-yellow:#edbb00;
--shadow-sm:0 1px 2px color-mix(in srgb,#2d2b2b 14%,transparent);--shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);--shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--color-bg);color:var(--color-text);font-family:'Source Serif 4','Noto Serif TC',serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
button,input{font:inherit;color:inherit}
input{outline-color:var(--color-accent)}
#app{width:100%;max-width:520px;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--color-bg)}
.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none;padding-top:var(--sat)}
.scroll::-webkit-scrollbar{display:none}
.c{cursor:pointer;user-select:none}
.muted{color:var(--color-neutral-700)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.page{padding:8px 22px 28px;display:flex;flex-direction:column;gap:14px}
.h1{font-size:26px;font-weight:600}
.back{font-size:14px;color:var(--color-accent-700)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--color-surface)}
.item:active{background:var(--color-neutral-300)}
.glyph{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.tag{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--color-bg);color:var(--color-accent-700)}
.inp{font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--color-divider);background:var(--color-bg);width:100%;min-width:0}
.btn{font-size:16px;font-weight:600;padding:14px;border:0;border-radius:16px;background:var(--color-accent);color:var(--color-bg);cursor:pointer;width:100%}
.btn:active{background:var(--color-accent-700)}
.btn.ghost{background:transparent;border:1.5px dashed var(--color-accent-400);color:var(--color-accent-700);font-weight:400}
.btn.soft{background:var(--color-surface);color:var(--color-text);font-weight:400}
.btn.warn{background:var(--color-accent-2-100);color:var(--color-accent-2-800);font-weight:400}
.btn[disabled]{opacity:.45}
.chip{white-space:nowrap;flex:none;padding:7px 13px;border-radius:999px;font-size:13px;border:1px solid var(--color-divider)}
.chip.on{border-color:var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.sw{width:46px;height:28px;border-radius:14px;background:var(--color-neutral-300);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--color-bg);box-shadow:var(--shadow-sm);transition:transform .2s}
.sw.on{background:var(--color-accent)}.sw.on::after{transform:translateX(18px)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 12px calc(10px + var(--sab));font-size:13px;text-align:center;background:var(--color-bg);border-top:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)}
.tabs span{padding:10px 0;color:var(--color-neutral-700)}
.tabs span.on{color:var(--color-accent-700);font-weight:600}
.fab{width:56px;height:56px;margin:-18px auto 0;border-radius:50%;background:var(--color-accent);color:var(--color-bg)!important;display:flex!important;align-items:center;justify-content:center;font-size:30px;box-shadow:var(--shadow-md);padding:0!important}
.monthnav{display:flex;align-items:center;gap:10px}
.monthnav b{font-size:26px;font-weight:600}
.monthnav .c{font-size:22px;color:var(--color-accent-700);padding:0 6px}
.monthnav .c.dis{opacity:.25;pointer-events:none}
#toast{position:absolute;top:calc(10px + var(--sat));left:10px;right:10px;z-index:5;padding:12px 14px;border-radius:22px;background:var(--color-surface);box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:center;transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.25,1.15)}
#toast.on{transform:translateY(0)}
#backdrop{position:absolute;inset:0;z-index:6;background:color-mix(in srgb,var(--color-neutral-900) 40%,transparent);opacity:0;pointer-events:none;transition:opacity .25s}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);background:var(--color-bg);border-radius:28px 28px 0 0;padding:10px 20px calc(18px + var(--sab));display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow-lg);max-height:96dvh;overflow-y:auto}
#sheet.on{transform:translateY(0)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--color-surface)}
.seg span{text-align:center;padding:8px;border-radius:11px;font-size:14px;color:var(--color-neutral-700)}
.seg span.on{background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-sm)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats span{display:flex;align-items:center;justify-content:center;padding:8px 0;border-radius:12px;font-size:13px;background:var(--color-surface)}
.cats span.on{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys span{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;background:var(--color-surface);font-size:20px}
.keys span:active{background:var(--color-neutral-300)}
.keys .save{grid-column:4;grid-row:1 / span 3;height:auto;background:var(--color-accent);color:var(--color-bg);font-size:16px;font-weight:600;writing-mode:vertical-rl;letter-spacing:.3em}
.keys .del{grid-column:4;grid-row:4;font-size:14px}
.listrow{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 8%,transparent)}
@keyframes petHop{0%{transform:translateY(0)}30%{transform:translateY(-16px) scale(1.04,.96)}60%{transform:translateY(0) scale(1.07,.93)}100%{transform:translateY(0) scale(1)}}
@keyframes petIdle{0%,100%{transform:scale(1)}50%{transform:scale(1.025,.975)}}
.hop{animation:petHop .6s ease}
.idle{animation:petIdle 3.2s ease-in-out infinite}
input[type=range]{width:100%;accent-color:var(--color-accent);margin:0}
input[type=date]{font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="main" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  <div id="toast" class="c" data-act="toastTap"><span id="toastPet" style="width:40px;height:40px;border-radius:12px;background:var(--color-accent-2-100);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden"></span><div class="col" style="flex:1;min-width:0;gap:1px"><span id="toastHead" class="muted" style="font-size:11px"></span><span id="toastTitle" style="font-size:14px;font-weight:600"></span><span id="toastBody" style="font-size:12px;color:var(--color-neutral-800)"></span></div></div>
  <div id="backdrop" data-act="closeSheet"></div>
  <div id="sheet"></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<script>
'use strict';
/* ========== 常數 ========== */
const OUT=[{k:'飲食',g:'食'},{k:'服飾',g:'衣'},{k:'居住',g:'住'},{k:'交通',g:'行'},{k:'教育',g:'育'},{k:'娛樂',g:'樂'},{k:'醫療',g:'醫'},{k:'其他',g:'其'}];
const IN=[{k:'薪水',g:'薪'},{k:'獎金',g:'獎'},{k:'投資',g:'投'},{k:'其他',g:'其'}];
const LIGHT=['服飾','娛樂','教育','其他'];
const COL={飲食:'var(--color-accent-2-500)',服飾:'var(--color-accent-2-300)',居住:'var(--color-accent-700)',交通:'var(--color-accent-500)',教育:'color-mix(in srgb,var(--color-process-yellow) 80%,var(--color-bg))',娛樂:'var(--color-accent-300)',醫療:'var(--color-accent-2-700)',其他:'var(--color-neutral-400)'};
const PETS=[{k:'pig',n:'小豬',def:'圓圓'},{k:'cat',n:'貓咪',def:'咪咪'},{k:'bunny',n:'兔兔',def:'蹦蹦'},{k:'penguin',n:'企鵝',def:'啾啾'},{k:'chick',n:'小雞',def:'嗶嗶'},{k:'sprout',n:'小芽',def:'芽芽',plant:true},{k:'sunflower',n:'向日葵',def:'小葵',plant:true}];
const BUD_SHARE={飲食:.22,服飾:.08,居住:.39,交通:.09,教育:.03,娛樂:.06,醫療:.03,其他:.10};
const DEF_ACCS=[
 {id:'cash',name:'現金',g:'現',sub:'錢包',on:true},
 {id:'card',name:'信用卡',g:'卡',sub:'信用卡',on:true},
 {id:'line',name:'LINE Pay',g:'L',sub:'行動支付',on:true},
 {id:'jko',name:'街口支付',g:'街',sub:'行動支付',on:false},
 {id:'easy',name:'悠遊卡',g:'悠',sub:'電子票證',on:true},
 {id:'bank',name:'銀行轉帳',g:'銀',sub:'銀行帳戶',on:true}
];
const KEY='jizhang-v1';
const NATIVE=(typeof window.Android==='object'&&window.Android)||null;
const nat=(f,...a)=>{try{return NATIVE&&NATIVE[f]?NATIVE[f](...a):null;}catch(e){return null;}};

/* ========== 工具 ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const today=()=>ymd(new Date());
const ymOf=s=>s.slice(0,7);
const curYM=()=>today().slice(0,7);
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const addMonth=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad(m);};
const mLabel=ym=>{const[y,m]=ym.split('-').map(Number);return (y===new Date().getFullYear()?'':y+' 年 ')+m+' 月';};
const md=s=>{const[,m,d]=s.split('-').map(Number);return m+'/'+d;};
const WD='日一二三四五六';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ========== 資料 ========== */
function fresh(){return{v:1,onboarded:false,created:today(),pet:'pig',petName:'圓圓',xp:0,budget:30000,catBud:scaleBud(30000),accs:DEF_ACCS.map(a=>({...a})),txs:[],fixed:[],posted:{},carrier:''};}
function scaleBud(total){const o={};for(const k in BUD_SHARE)o[k]=Math.round(total*BUD_SHARE[k]/500)*500;return o;}
let D;
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(!raw&&NATIVE)raw=nat('loadData')||null;   /* App 內：localStorage 遺失時從手機檔案還原 */
  try{D=raw?Object.assign(fresh(),JSON.parse(raw)):fresh();}catch(e){D=fresh();}
}
function persist(){
  const j=JSON.stringify(D);let ok=false;
  try{localStorage.setItem(KEY,j);ok=true;}catch(e){}
  if(NATIVE&&nat('saveData',j)!==false)ok=true;   /* App 內：同時寫一份到手機檔案 */
  if(!ok)toast('儲存失敗','手機空間可能不足，請先匯出備份','');
}
load();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* UI 狀態（不存檔） */
const U={step:0,tab:'home',sub:null,sheet:false,editId:null,draft:null,filter:'全部',ym:curYM(),line:0,happy:false,hop:false,nf:{type:'out',name:'',amt:'',day:'',src:''},toastTx:null,installEvt:null,newAcc:''};

/* 固定收支自動入帳：從建立日起，每月到期日（含今天）自動記一筆 */
function postFixed(){
  const t=today();let n=0;
  for(const f of D.fixed){
    let ym=ymOf(f.since||f.created||t);
    while(ym<=ymOf(t)){
      const day=Math.min(f.day,daysIn(ym)),date=ym+'-'+pad(day),key=f.id+'|'+ym;
      if(!D.posted[key]&&date<=t&&date>=(f.since||f.created||t)){
        D.posted[key]=1;
        D.txs.push({id:uid(),type:f.type||'out',amt:f.amt,cat:f.cat||(f.type==='in'?'薪水':'其他'),name:f.name,src:f.src,date,t:'00:00',fixed:f.id});
        n++;
      }
      ym=addMonth(ym,1);
    }
  }
  if(n)persist();
  return n;
}

/* ========== 自動記帳（App 版：從付款通知來的紀錄） ========== */
const CAT_RULES=[
 ['飲食',/全家|7-?ELEVEN|7-?11|統一超商|萊爾富|OK ?mart|全聯|家樂福|美廉社|麥當勞|肯德基|摩斯|星巴克|STARBUCKS|路易莎|cama|85度C|Foodpanda|Uber ?Eats|吉野家|鼎泰豐|餐|食|飯|麵|咖啡|茶|飲|便當|早餐|超商|超市/i],
 ['交通',/捷運|台鐵|臺鐵|高鐵|客運|計程車|大車隊|Uber|LINE ?TAXI|中油|台塑石油|加油|停車|YouBike|ETC|遠通|悠遊卡加值|一卡通/i],
 ['居住',/台電|電費|水費|自來水|瓦斯|管理費|房租|IKEA|特力屋|HOLA|中華電信|台灣大哥大|遠傳|亞太電信|第四台|寬頻/i],
 ['服飾',/UNIQLO|GU|ZARA|H&M|NET|服飾|鞋|Nike|adidas/i],
 ['娛樂',/威秀|國賓|秀泰|Netflix|Spotify|KKBOX|YouTube|Steam|PlayStation|Nintendo|KTV|錢櫃|好樂迪|Disney|遊戲|電影/i],
 ['醫療',/診所|醫院|藥局|藥妝|屈臣氏|康是美|大樹|杏一|牙醫|健保/i],
 ['教育',/書店|誠品|金石堂|博客來|課程|Hahow|補習|學費|Udemy/i]
];
function guessCat(type,text){
  if(type==='in')return /薪/.test(text)?'薪水':/獎/.test(text)?'獎金':'其他';
  for(const[k,re]of CAT_RULES)if(re.test(text))return k;
  return '其他';
}
function pullAuto(){
  if(!NATIVE||!D.onboarded)return 0;
  let arr=[];try{arr=JSON.parse(nat('pullPending')||'[]');}catch(e){}
  if(!arr.length)return 0;
  let last=null;
  for(const a of arr){
    const id='pkg:'+a.pkg,label=a.label||a.pkg;
    let acc=D.accs.find(x=>x.id===id||(x.pkgs||[]).includes(a.pkg))||D.accs.find(x=>x.name===label);
    if(!acc){acc={id,name:label,g:label[0],sub:'自動記帳',on:true};D.accs.push(acc);}
    if(acc.id!==id&&!(acc.pkgs||[]).includes(a.pkg))acc.pkgs=[...(acc.pkgs||[]),a.pkg];
    const d=new Date(a.time||Date.now()),type=a.type==='in'?'in':'out',name=(a.merchant||'').trim()||acc.name;
    const tx={id:uid(),type,amt:+a.amt,cat:guessCat(type,(a.merchant||'')+' '+(a.text||'')),src:acc.id,name,date:ymd(d),t:hm(d),auto:true,raw:a.text||''};
    D.txs.push(tx);D.xp++;last=tx;
  }
  persist();
  if(!U.sheet)render();
  if(arr.length===1)toast(`${esc(D.petName||'夥伴')} · 自動記帳`,`${esc(accOf(last.src).name)} ${last.type==='in'?'入帳':'付款'} $${fmt(last.amt)}`,`${esc(last.name)} · 已自動記入「${last.cat}」，點一下修改`,last.id);
  else toast(`${esc(D.petName||'夥伴')} · 自動記帳`,`幫你記了 ${arr.length} 筆`,'點「明細」可以檢查、修改分類');
  return arr.length;
}
window.__onNative=()=>{pullAuto();};

/* ========== 夥伴繪製（沿用原型的造型） ========== */
function pet(kind,s,happy,hop,idle){
  const oy=24,kids=[];
  const st=o=>Object.entries(o).map(([k,v])=>k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+':'+(typeof v==='number'&&!['opacity'].includes(k)?v+'px':v)).join(';');
  const P=(o,inner='')=>kids.push(`<div style="position:absolute;${st(o)}">${inner}</div>`);
  const orange='color-mix(in srgb,var(--color-process-yellow) 55%,var(--color-accent-2-500))';
  const c={pig:{b1:'var(--color-accent-2-100)',b2:'var(--color-accent-2-200)',b3:'var(--color-accent-2-300)',ear:'var(--color-accent-2-300)',inn:'var(--color-accent-2-400)',foot:'var(--color-accent-2-300)'},
    cat:{b1:'var(--color-neutral-100)',b2:'var(--color-neutral-300)',b3:'var(--color-neutral-500)',ear:'var(--color-neutral-500)',inn:'var(--color-accent-2-300)',foot:'var(--color-neutral-500)'},
    bunny:{b1:'var(--color-bg)',b2:'var(--color-neutral-100)',b3:'var(--color-neutral-300)',ear:'var(--color-neutral-200)',inn:'var(--color-accent-2-200)',foot:'var(--color-neutral-300)'},
    penguin:{b1:'var(--color-accent-600)',b2:'var(--color-accent-800)',b3:'var(--color-accent-900)',foot:orange},
    chick:{b1:'color-mix(in srgb,var(--color-process-yellow) 30%,var(--color-bg))',b2:'color-mix(in srgb,var(--color-process-yellow) 65%,var(--color-bg))',b3:'var(--color-process-yellow)',foot:orange}}[kind];
  const eyeDot='<span style="position:absolute;left:3px;top:3px;width:4px;height:4px;border-radius:50%;background:var(--color-bg)"></span>';
  const face=(ex,ey,cx,cy,mx,my)=>{
    [ex,ex+30].forEach(l=>happy?P({left:l-1,top:ey+5,width:15,height:8,borderRadius:'9px 9px 0 0',border:'3px solid var(--color-text)',borderBottom:'none'}):P({left:l,top:ey,width:12,height:15,borderRadius:'50%',background:'var(--color-text)'},eyeDot));
    [cx,cx+62].forEach(l=>P({left:l,top:cy,width:20,height:11,borderRadius:'50%',background:'var(--color-accent-2-400)',opacity:.45}));
    P({left:mx,top:my,width:14,height:7,borderRadius:'0 0 9px 9px',border:'2.5px solid var(--color-text)',borderTop:'none'});
  };
  if(kind==='sprout'||kind==='sunflower'){
    const lv=Math.min(3,1+Math.floor(D.xp/5));
    P({left:30,top:138+oy,width:120,height:10,borderRadius:'50%',background:'color-mix(in srgb,var(--color-text) 12%,transparent)'});

/* ========== Code 39 條碼（財政部手機條碼） ========== */
const C39={'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001','5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100','A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000','F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100','K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010','P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110','U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000','Z':'011010000','-':'010000101','.':'110000100',' ':'011000100','*':'010010100','$':'010101000','/':'010100010','+':'010001010','%':'000101010'};
function code39svg(text){
  const N=2,W=6,Q=24,H=90;let x=Q,rects='';
  const s='*'+text+'*';
  for(let ci=0;ci<s.length;ci++){
    const p=C39[s[ci]];if(!p)continue;
    for(let i=0;i<9;i++){const w=p[i]==='1'?W:N;if(i%2===0)rects+=`<rect x="${x}" y="0" width="${w}" height="${H}"/>`;x+=w;}
    if(ci<s.length-1)x+=N;
  }
  const total=x+Q;
  return `<svg viewBox="0 0 ${total} ${H}" preserveAspectRatio="none" style="width:100%;height:96px;display:block;background:#fff" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="${total}" height="${H}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

function streak(){
  const days=new Set(D.txs.filter(t=>!t.fixed).map(t=>t.date));
  const d=new Date();if(!days.has(ymd(d)))d.setDate(d.getDate()-1);
  let n=0;while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}

function nextFixed(){

}

/* ========== 記一筆 sheet ========== */
function openSheet(id){
  if(id){const t=D.txs.find(x=>String(x.id)===String(id));if(!t)return;U.editId=t.id;U.draft={type:t.type,amt:String(t.amt),cat:t.cat,src:t.src,note:t.name,date:t.date};}
  else{U.editId=null;const on=D.accs.filter(a=>a.on);U.draft={type:'out',amt:'',cat:'飲食',src:(on.find(a=>a.id===U.lastSrc)||on[0]||{}).id,note:'',date:today()};}
  U.sheet=true;renderSheet();
  $('#sheet').classList.add('on');$('#backdrop').classList.add('on');hideToast();
}
function closeSheet(){U.sheet=false;$('#sheet').classList.remove('on');$('#backdrop').classList.remove('on');}
function renderSheet(){
  const d=U.draft,isIn=d.type==='in',ed=U.editId&&D.txs.find(t=>t.id===U.editId);
  const srcs=D.accs.filter(a=>a.on||a.id===d.src);
  $('#sheet').innerHTML=`<span style="align-self:center;width:40px;height:5px;border-radius:3px;background:var(--color-neutral-300)"></span>
  <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:18px;font-weight:600">${U.editId?'修改這筆':'記一筆'}</span><span class="c back" data-act="closeSheet">取消</span></div>
  ${ed&&ed.auto?`<span style="font-size:12px;padding:8px 12px;border-radius:12px;background:var(--color-accent-100);color:var(--color-accent-800)">由 ${esc(accOf(ed.src).name)} 於 ${md(ed.date)} ${ed.t} 自動記帳</span>`:''}
  ${ed&&ed.fixed?`<span style="font-size:12px;padding:8px 12px;border-radius:12px;background:var(--color-accent-100);color:var(--color-accent-800)">這是每月固定收支自動記的一筆，這裡只改這一次</span>`:''}
  <div class="seg"><span class="c ${!isIn?'on':''}" data-act="dType" data-k="out">支出</span><span class="c ${isIn?'on':''}" data-act="dType" data-k="in">收入</span></div>
  <div style="display:flex;align-items:baseline;gap:6px;padding:0 4px"><span style="font-size:22px;color:var(--color-neutral-700)">${isIn?'+':'−'}$</span><span id="dAmt" style="font-size:44px;font-weight:600;line-height:1.05;color:${d.amt?(isIn?'var(--color-accent-700)':'var(--color-text)'):'var(--color-neutral-400)'}">${esc(d.amt||'0')}</span>
    <input type="date" data-in="d.date" value="${d.date}" max="${today()}" style="margin-left:auto;border:1px solid var(--color-divider);border-radius:10px;padding:6px 8px;background:var(--color-surface)"></div>
  <div class="cats">${(isIn?IN:OUT).map(c=>`<span class="c ${d.cat===c.k?'on':''}" data-act="dCat" data-k="${c.k}">${c.k}</span>`).join('')}</div>
  <div class="hscroll">${srcs.map(a=>`<span class="c chip ${d.src===a.id?'on':''}" data-act="dSrc" data-k="${a.id}" style="font-size:12px;padding:6px 12px">${esc(a.name)}</span>`).join('')}</div>
  <input class="inp" data-in="d.note" placeholder="備註，例如 午餐便當" value="${esc(d.note)}" maxlength="30" style="background:var(--color-surface)">
  <div class="keys">${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map((k,i)=>`<span class="c" data-act="key" data-k="${k}" style="grid-column:${i%3+1}">${k}</span>`).join('')}
  <span class="c save" id="saveBtn" data-act="save" style="opacity:${parseFloat(d.amt)?1:.45}">儲存</span>
  <span class="c del" data-act="dDel" style="background:${U.editId?'var(--color-accent-2-100)':'var(--color-surface)'};color:${U.editId?'var(--color-accent-2-800)':'var(--color-text)'}">${U.editId?'刪除':'清除'}</span></div>`;
  const on=$('#sheet .chip.on');if(on){const h=on.parentElement;h.scrollLeft=on.offsetLeft-h.offsetLeft-40;}
}
function saveTx(){
  const d=U.draft,amt=Math.round(parseFloat(d.amt)*100)/100;if(!amt)return;
  const name=(d.note||'').trim()||d.cat,date=d.date&&d.date<=today()?d.date:today();
  if(U.editId){
    D.txs=D.txs.map(t=>t.id===U.editId?{...t,type:d.type,amt,cat:d.cat,src:d.src,name,date}:t);
    persist();closeSheet();render();
  }else{
    const tx={id:uid(),type:d.type,amt,cat:d.cat,src:d.src,name,date,t:hm(new Date())};
    D.txs.push(tx);D.xp++;if(d.type==='out')U.lastSrc=d.src;persist();closeSheet();
    if(U.ym!==ymOf(date))U.ym=ymOf(date);
    feed();
    toast(`${esc(D.petName||'夥伴')} · 記好了`,`${d.type==='in'?'+':'−'}$${fmt(amt)} · ${esc(name)}`,`已記入「${d.cat}」，點一下修改`,tx.id);
    if(D.xp%5===0)setTimeout(()=>toast('升級了！',`${esc(D.petName||'夥伴')} 升到 Lv.${level()}`,'謝謝你天天記帳 ♥'),2600);
  }
}

let toastT,happyT;
function feed(){U.happy=true;U.hop=true;render();setTimeout(()=>{U.hop=false;},700);clearTimeout(happyT);happyT=setTimeout(()=>{U.happy=false;if(!U.sheet)render();},1600);}
function toast(head,title,body,txId){
  $('#toastPet').innerHTML=pet(D.pet,.26,true,false,false);
  $('#toastHead').innerHTML=head;$('#toastTitle').innerHTML=title;$('#toastBody').innerHTML=body||'';
  U.toastTx=txId||null;$('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(hideToast,4000);
}
function hideToast(){$('#toast').classList.remove('on');}
function download(name,text,type){
  if(NATIVE){const r=nat('saveFile',name,text,type);toast(r?'已儲存':'儲存失敗',r?esc(name):'請再試一次',r?'在手機的「下載」資料夾':'');return;}
const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}

const ACT={
  obNext(){if(U.step<3){U.step++;render();}else{D.onboarded=true;if(!D.catBudSet)D.catBud=scaleBud(D.budget);persist();U.tab='home';U.sub=null;
    if(NATIVE&&!nat('hasNotifAccess')){U.tab='me';U.sub='auto';}render();}},
  obBack(){if(U.step){U.step--;render();}},
  obBud(e){D.budget=+e.dataset.v;persist();render();},
  pickPet(e){const cur=PETS.find(x=>x.k===D.pet),p=PETS.find(x=>x.k===e.dataset.k);if(!D.petName||D.petName===cur.def)D.petName=p.def;D.pet=p.k;persist();U.hop=true;render();setTimeout(()=>U.hop=false,700);},
  accToggle(e){const a=D.accs.find(x=>x.id===e.dataset.id);if(!a)return;if(a.on&&D.accs.filter(x=>x.on).length<=1){toast('至少要留一個','付款方式至少要開一個','');return;}a.on=!a.on;persist();render();},
  tab(e){U.tab=e.dataset.k;U.sub=null;if(U.tab==='list'||U.tab==='report'){}render();$('#main .scroll')&&($('#main .scroll').scrollTop=0);},
  sub(e){U.tab='me';U.sub=e.dataset.k;render();},
  back(){U.sub=null;render();},
  ym(e){const n=addMonth(U.ym,+e.dataset.k);if(n<=curYM()){U.ym=n;render();}},
  filter(e){U.filter=e.dataset.k;render();},
  talk(){U.line++;U.hop=true;render();setTimeout(()=>U.hop=false,700);},
  add(){openSheet(null);},
  edit(e){openSheet(e.dataset.id);},
  toastTap(){hideToast();if(U.toastTx)openSheet(U.toastTx);},
  closeSheet(){closeSheet();},
  dType(e){U.draft.type=e.dataset.k;U.draft.cat=e.dataset.k==='in'?'薪水':'飲食';if(e.dataset.k==='in'&&D.accs.find(a=>a.id==='bank'&&a.on))U.draft.src='bank';renderSheet();},
  dCat(e){U.draft.cat=e.dataset.k;renderSheet();},
  dSrc(e){U.draft.src=e.dataset.k;renderSheet();},
  key(e){const k=e.dataset.k;let a=U.draft.amt;
    if(k==='⌫')a=a.slice(0,-1);else if(k==='.'){if(!a.includes('.'))a=(a||'0')+'.';}
    else if(a.length<9&&!(a.includes('.')&&a.split('.')[1].length>=2))a=(a==='0'?'':a)+k;
    U.draft.amt=a;renderSheet();},
  save(){saveTx();},
  dDel(){if(U.editId){if(!confirm('確定刪除這筆？'))return;D.txs=D.txs.filter(t=>t.id!==U.editId);persist();closeSheet();render();}else{U.draft.amt='';renderSheet();}},
  nfType(e){U.nf.type=e.dataset.k;U.nf.src='';U.nf.cat='';render();},
  nfCat(e){U.nf.cat=e.dataset.k;render();},
  nfSrc(e){U.nf.src=e.dataset.k;render();},
  addFixed(){const nf=U.nf;if(!(nf.name.trim()&&+nf.amt>0&&+nf.day>=1&&+nf.day<=31))return;
    D.fixed.push({id:uid(),name:nf.name.trim(),amt:+nf.amt,day:+nf.day,src:nf.src||(nf.type==='in'?'bank':'card'),type:nf.type,cat:nf.cat,since:today()});
    U.nf={type:nf.type,name:'',amt:'',day:'',src:'',cat:''};const n=postFixed();persist();render();
    if(n)toast('固定收支','今天就是到期日',`已自動記入 ${n} 筆`);},

  bud(e){D.budget=Math.max(1000,D.budget+ +e.dataset.k);persist();render();},

  addAcc(){const n=U.newAcc.trim();if(!n)return;D.accs.push({id:uid(),name:n,g:n[0],sub:/卡/.test(n)?'信用卡':'自訂',on:true});U.newAcc='';persist();render();},

    download(`記帳明細-${today()}.csv`,'﻿'+rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\r\n'),'text/csv;charset=utf-8');},

};

  else if(k.startsWith('nf.')){const f=k.slice(3);if(f!=='name')v=v.replace(/\D/g,'').slice(0,f==='day'?2:8);el.value=v;U.nf[f]=v;const nf=U.nf,b=$('#nfAdd');if(b)b.disabled=!(nf.name.trim()&&+nf.amt>0&&+nf.day>=1&&+nf.day<=31);}
  else if(k==='catBud'){D.catBud[el.dataset.k]=+v;persist();const c=$('#cb-'+el.dataset.k);if(c)c.textContent='$'+fmt(+v);const s=$('#catSum');if(s)s.textContent='分類加總 $'+fmt(Object.values(D.catBud).reduce((a,b)=>a+b,0));D.catBudSet=true;}
  else if(k==='accName'){const a=D.accs.find(x=>x.id===el.dataset.id);if(a&&v.trim()){a.name=v.trim();a.g=v.trim()[0];persist();}}
  else if(k==='newAcc'){U.newAcc=v;}
  else if(k==='d.note'){U.draft.note=v;}
  else if(k==='d.date'){U.draft.date=v;}
  else if(k==='carrier'){let s=v.toUpperCase().replace(/[^0-9A-Z.+\-\/]/g,'');if(s&&s[0]!=='/')s='/'+s;s=s?'/'+s.slice(1).replace(/\//g,''):'';s=s.slice(0,8);el.value=s;D.carrier=s==='/'?'':s;persist();
    if(carrierOk(D.carrier)||D.carrier.length===8){render();const i=$('#carrierIn');if(i)i.blur();}else{const h=$('#carrierHint');if(h)h.textContent='只存在這支手機裡。';}}
});
document.addEventListener('change',ev=>{const k=ev.target.dataset.in;if(k==='petName'||k==='accName')render();});

$('#importFile').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{const obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.txs)||!Array.isArray(obj.accs))throw 0;
    if(!confirm(`備份裡有 ${obj.txs.length} 筆紀錄，匯入後會取代目前手機上的資料，確定？`))return;
    D=Object.assign(fresh(),obj);persist();postFixed();U.sub=null;U.tab='home';render();toast('匯入完成',`${obj.txs.length} 筆紀錄已還原`,'');
  }catch(e){toast('匯入失敗','這不是記帳小夥伴的備份檔','');}
});

/* 安裝提示 */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();U.installEvt=e;if(D.onboarded&&U.tab==='me'&&!U.sub)render();});
window.addEventListener('appinstalled',()=>{U.installEvt=null;});

/* 回到 App 時：補記到期的固定收支、日期跨日重畫 */
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;pullAuto();if(U.sub==='auto'&&!U.sheet)render();const n=postFixed();if(n||today()!==lastDay){lastDay=today();if(!U.sheet)render();}if(n)toast('固定收支',`已自動記入 ${n} 筆`,'到期的房租、訂閱、薪水都記好了');});

/* Android 返回鍵：關 sheet／回上一層 */
window.__back=()=>{
  if(U.sheet){closeSheet();return true;}
  if(U.sub){U.sub=null;render();return true;}
  if(D.onboarded&&U.tab!=='home'){U.tab='home';render();return true;}
  if(!D.onboarded&&U.step){U.step--;render();return true;}
  return false;
};
if(!NATIVE){
  history.replaceState({r:1},'');history.pushState({r:2},'');
  window.addEventListener('popstate',()=>{if(window.__back())history.pushState({r:2},'');else history.back();});
}

/* 啟動 */
const posted0=D.onboarded?postFixed():0;
render();
if(posted0)setTimeout(()=>toast('固定收支',`已自動記入 ${posted0} 筆`,'到期的房租、訂閱、薪水都記好了'),600);
setTimeout(pullAuto,posted0?4800:400);
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
