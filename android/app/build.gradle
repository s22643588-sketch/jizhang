plugins {
    id 'com.android.application'
}

def vc = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace 'tw.jizhang.app'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.jizhang.app'
        minSdk 29
        targetSdk 35
        versionCode vc
        versionName "1.0.${vc}"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASS')
            keyAlias 'jizhang'
            keyPassword System.getenv('KEYSTORE_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
